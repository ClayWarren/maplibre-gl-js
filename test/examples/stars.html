<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Stars</title>
    <meta property="og:created" content="2026-09-27">
    <meta property="og:description" content="Toggle decorative stars rendered behind a globe without external tiles.">
    <meta property="og:category" content="Globe">
    <link rel="icon" href="data:,">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="../../dist/maplibre-gl.css">
    <style>
        body { margin: 0; background: #070b14; }
        #map { position: absolute; inset: 0; }
        #controls { position: absolute; top: 12px; left: 12px; color: white; background: #172033; padding: 12px; font: 16px sans-serif; }
    </style>
</head>
<body>
    <div id="map"></div>
    <label id="controls"><input id="stars" type="checkbox" checked> MapLibre stars</label>
    <script type="module">
        import * as maplibregl from '../../dist/maplibre-gl-dev.mjs';
        const sky = {
            'star-opacity': 1,
            'backdrop-color': '#070b14',
            'sky-color': 'transparent',
            'horizon-color': 'transparent',
            'atmosphere-blend': 0
        };
        window.map = new maplibregl.Map({
            container: 'map',
            center: [0, 20],
            zoom: 0,
            canvasContextAttributes: {preserveDrawingBuffer: true},
            style: {
                version: 8,
                projection: {type: 'globe'},
                transition: {duration: 0},
                sky,
                sources: {},
                layers: [{id: 'earth', type: 'background', paint: {'background-color': '#163650'}}]
            }
        });
        document.getElementById('stars').addEventListener('change', (event) => {
            window.map.setSky({...sky, 'star-opacity': event.target.checked ? 1 : 0});
        });
    </script>
</body>
</html>
